name: PR

on:
  pull_request: { }

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hulk-sdk-go
        with:
          ssh-key: ${{ secrets.HULK_SDK_GO_READ_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-hulk-sdk-go
        with:
          ssh-key: ${{ secrets.HULK_SDK_GO_READ_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hulk-sdk-go
        with:
          ssh-key: ${{ secrets.HULK_SDK_GO_READ_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Run go test
        run: go test -tags goolm,stdjson ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hulk-sdk-go
        with:
          ssh-key: ${{ secrets.HULK_SDK_GO_READ_KEY }}

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

      - name: Build the core image with private module secrets
        run: |
          docker build --target builder --file docker/Dockerfile \
            --secret "id=hulk_sdk_key,src=$HULK_SDK_GO_AUTH_DIR/key" \
            --secret "id=hulk_sdk_hosts,src=$HULK_SDK_GO_AUTH_DIR/known_hosts" \
            --secret "id=hulk_sdk_gitconfig,src=$HULK_SDK_GO_AUTH_DIR/gitconfig" \
            --tag picoclaw-sdk-auth-validation .
